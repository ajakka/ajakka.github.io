<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Sometype+Mono"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Abderrahim Ajakka</title>
    <style>
      /* Page-specific: the ASCII banner has to scale with the viewport. */
      .ascii-name {
        max-width: 90%;
        overflow-x: auto;
      }

      .ascii-art {
        white-space: pre;
        font-family: var(--font-mono);
        line-height: 1.2;
        font-size: 1.1em;
      }

      .intro {
        margin: var(--space-3) 0;
      }

      .intro > * + * {
        margin-top: var(--space-1);
      }

      @media (max-width: 768px) {
        .ascii-art {
          font-size: 0.95em;
        }
      }

      @media (max-width: 480px) {
        .ascii-art {
          font-size: 0.6em;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="ascii-name">
        <div id="ascii-art" class="ascii-art"></div>

        <div class="intro">
          <h3>/ˌæbdɛrɑˈhiːm/</h3>
          <h3>Software Engineer && Technology Enthusiast</h3>
        </div>

        <div class="page-header">
          <div class="link-row">
            <a href="https://github.com/ajakka" target="_blank">~/GitHub</a>
            <a href="https://www.linkedin.com/in/abdajakka/" target="_blank"
              >~/LinkedIn</a
            >
            <a href="https://stackoverflow.com/users/8679455/abderrahim-ajakka"
              >~/StackOverflow</a
            >
          </div>
          <div id="theme-toggle" class="theme-toggle">
            <p id="theme-text">Lights: OFF</p>
          </div>
        </div>

        <div class="section">
          <div class="terminal-prompt">
            <p>┌──(~)</p>
            <p>└─#&nbsp;ls</p>
          </div>

          <div class="command-output link-row">
            <a href="/about">About</a>
            <a href="/projects">Projects</a>
            <a href="/blog">Blog</a>
          </div>
        </div>
      </div>
    </main>
    <script src="/scripts/lights.js"></script>
    <script src="/scripts/ascii-art.js"></script>
  </body>

  <!-- The making of this website may or may not be done fully or partialy using AI :D -->
</html>
